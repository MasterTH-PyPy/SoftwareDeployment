name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # windows-latest so the WinForms (net10.0-windows) projects build too.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SoftwareDeployment.sln

      - name: Build (Release)
        run: dotnet build SoftwareDeployment.sln -c Release --no-restore
